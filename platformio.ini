; BierLiftOS – PlatformIO-Build
;
; Der Quellcode bleibt im Ordner BierLift2 (src_dir), damit er weiterhin auch
; mit der Arduino-IDE geöffnet werden kann.
;
; Bauen:        pio run
; Flashen USB:  pio run -t upload
; Monitor:      pio device monitor
; Das fertige Image liegt danach in .pio/build/bierlift/firmware.bin
; (= BierLift2.ino.esp32_0x10000.bin für das Web-Update).

[platformio]
src_dir = BierLift2
default_envs = bierlift

[env:bierlift]
; espressif32 3.5.0 = Arduino-ESP32-Core 1.0.6 (ESP-IDF 3.3.5),
; derselbe Core wie beim bisherigen Build 25.06.27r.
platform = espressif32@3.5.0
board = esp32dev
framework = arduino

; Speicherlayout wie bisher (min_spiffs: 2 x 1,9 MB App für OTA, 192 KB SPIFFS).
; Nicht ändern – sonst passen Web-Updates und gespeicherte Einstellungen nicht mehr.
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dout
board_build.f_flash = 40000000L

monitor_speed = 115200
upload_speed = 921600

; Feste Versionen, damit der Build reproduzierbar bleibt.
; AsyncTCP, ESPAsyncWebServer, AsyncMqttClient und Blynk (1.0.1 mit setTemplateID)
; liegen eingefroren in lib/ – siehe lib/README.md.
lib_deps =
    bblanchon/ArduinoJson @ 6.21.5
    fastled/FastLED @ 3.5.0
    dfrobot/DFRobotDFPlayerMini @ 1.0.6
    sui77/rc-switch @ 2.6.4
    paulstoffregen/OneWire @ 2.3.7
    milesburton/DallasTemperature @ 3.11.0
    gyverlibs/FastBot @ 2.27.3

; Nur die hier gelisteten Bibliotheken verwenden (keine Zufallstreffer aus globalen Ordnern).
lib_ldf_mode = chain+
